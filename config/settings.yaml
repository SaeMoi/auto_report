# reportgen 기본 설정. 프로젝트별 값은 projects/<이름>/project.yaml에서 덮어씀
timezone: "+09:00"

# 입력 방식: export(노션 Markdown & CSV 내보내기, 1안) | api(노션 API, 2안) | json(canonical.json 직접)
input_mode: export

# 입력 검사 기준. false(기본)면 완화 기준: 빈칸·소제목 누락은 경고로만 알리고 보고서 초안을 만듦.
# true면 규격서대로 모두 오류로 막음(최종본 전에 켜서 확인)
strict_input: false

# 자동 마스킹. true(기본)면 토큰·비밀번호·세션 값·AWS 식별자·해시·이메일 등을 규칙으로 가린 뒤 AI와 보고서에 씀.
# 「마스킹 완료」 체크는 필요 없음. 스크린샷은 가리지 못하므로 사람이 확인함. false면 체크한 페이지만 AI로 보냄
auto_mask: true

# 그림 설명(부록 G·본문 그림 아래)을 쓸 때 AI가 스크린샷을 직접 보게 함.
# true(기본): 에이전트·claude_cli·codex_cli·API 어댑터에 그림 파일을 넘김(스크린샷은 사람이 미리 가려 둔 것만 올림)
# false: 그림 앞뒤 문단과 페이지 제목만으로 씀(그림은 모델에 보내지 않음)
ai_read_images: true

# 노션 DB 이름(노션 DB 입력 규격 0-1). 이름이 다르면 여기서 맞춤
notion_db_names:
  P1: 문서 정보
  P2: 자산
  P3: 목표
  R1: 취약점 건
  R2: 취약점
  R3: 진단 항목 판정
  R4: 시나리오
  R5: 시나리오 단계
  R6: 취약점 패치
  R7: 재진단
  B1: 관제 환경
  B2: 로그 소스
  B3: 와주 모듈
  B4: 탐지 검증 테스트 케이스
  B5: 탐지 전략서
  B6: 침해사고 분석
  B7: SCA 결과
  B8: 클라우드 감시
  B9: 개선 과제
  B10: 운영 통계

# 증거 번호 대역(노션 규격 4-2)
evidence_ranges:
  red: 1
  blue: 500

# 출력
output:
  formats: [docx, pdf]
  docx_reference: templates/reference.docx   # 글꼴·스타일 원본(없으면 기본 스타일)
  libreoffice: soffice                         # Mac: /Applications/LibreOffice.app/Contents/MacOS/soffice
